<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lingua Matrix">
<title>Lingua Matrix</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #f5f1eb; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  #header {
    background: #1a1a2e;
    padding: 14px 16px 10px;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  #app-title { font-size: 11px; letter-spacing: 3px; color: #52b788; text-transform: uppercase; font-weight: 800; margin-bottom: 8px; }

  .pill-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pill {
    padding: 5px 12px; border-radius: 20px; border: none;
    background: rgba(255,255,255,0.1); color: #ccc;
    cursor: pointer; font-size: 12px; font-weight: 700;
    transition: all 0.15s; font-family: inherit;
  }
  .pill.active { background: #52b788; color: #1a1a2e; }

  .toggle-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .toggle-group { display: flex; background: rgba(255,255,255,0.08); border-radius: 8px; overflow: hidden; }
  .toggle-btn {
    padding: 5px 14px; border: none; background: transparent; color: #aaa;
    cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit; transition: all 0.15s;
  }
  .toggle-btn.active-mode { background: #e07a5f; color: #fff; }
  .toggle-btn.active-section { background: #457b9d; color: #fff; }

  #day-strip {
    background: #13132a; padding: 7px 16px;
    display: flex; gap: 10px; overflow-x: auto;
    scrollbar-width: none;
  }
  #day-strip::-webkit-scrollbar { display: none; }
  .day-cell { text-align: center; min-width: 48px; }
  .day-label { font-size: 9px; color: #555; letter-spacing: 1px; text-transform: uppercase; }
  .day-pair { font-size: 10px; color: #52b788; font-weight: 700; margin-top: 2px; }
  .day-cell.today .day-label { color: #52b788; }
  .day-cell.today .day-pair { color: #fff; }

  #content { padding: 14px 14px 40px; max-width: 680px; margin: 0 auto; }

  .lang-badges { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .lang-badge {
    border-radius: 8px; padding: 6px 16px;
    font-size: 13px; font-weight: 800; letter-spacing: 1px;
  }

  .section-label { font-size: 10px; color: #999; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 14px; }

  .tense-block { margin-bottom: 28px; }
  .tense-name { font-family: Georgia, serif; font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
  .tense-grid { display: grid; gap: 10px; margin-bottom: 6px; }
  .tense-grid.cols2 { grid-template-columns: 1fr 1fr; }
  .tense-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
  .lang-col { border-radius: 10px; overflow: hidden; }
  .lang-col-header { padding: 6px 10px; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; color: #fff; text-transform: uppercase; }
  .lang-row { padding: 5px 10px; font-size: 12px; color: #e8f4f8; font-family: Georgia, serif; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; gap: 6px; align-items: baseline; }
  .lang-row:last-child { border-bottom: none; }
  .subj-label { opacity: 0.4; font-size: 10px; min-width: 24px; flex-shrink: 0; }
  .tense-note { background: #f0f4e8; border-left: 3px solid #52b788; border-radius: 0 6px 6px 0; padding: 7px 10px; font-size: 11px; color: #2d4a35; font-style: italic; }

  .morph-block { margin-bottom: 16px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.07); }
  .morph-header { background: #1a1a2e; padding: 7px 12px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .morph-cat { color: #aaa; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; margin-right: 4px; }
  .morph-badge { border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; font-family: monospace; }
  .morph-row { display: grid; padding: 5px 12px; border-bottom: 1px solid #f0f0f0; }
  .morph-row:last-child { border-bottom: none; }
  .morph-row.cols2 { grid-template-columns: 1fr 1fr; }
  .morph-row.cols3 { grid-template-columns: 1fr 1fr 1fr; }
  .morph-word { font-family: Georgia, serif; font-size: 13px; }

  /* Flashcard */
  #flashcard-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 8px; }
  #card-counter { font-size: 12px; color: #888; letter-spacing: 1px; }
  #card {
    cursor: pointer; width: 100%; max-width: 420px; min-height: 190px;
    border-radius: 16px; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    background: #f7f3ee; border: 2px solid #ddd;
    transition: background 0.2s, border-color 0.2s;
    padding: 28px 24px; text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    user-select: none;
  }
  #card.flipped { background: #1a1a2e; border-color: #52b788; }
  #card-category { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #aaa; margin-bottom: 10px; }
  #card.flipped #card-category { color: #52b788; }
  #card-main { font-family: Georgia, serif; font-size: 21px; color: #1a1a2e; }
  #card.flipped #card-main { color: #e8f4f8; }
  #card-hint { margin-top: 18px; font-size: 11px; color: #bbb; }
  #card-note { margin-top: 14px; font-size: 11px; color: #aaa; font-style: italic; display: none; }
  #card.flipped #card-note { display: block; }
  #card.flipped #card-hint { display: none; }
  .card-btns { display: flex; gap: 12px; }
  .card-btn {
    padding: 10px 26px; border-radius: 8px; font-size: 14px;
    cursor: pointer; font-family: inherit; font-weight: 600;
  }
  #btn-prev { border: 1px solid #ddd; background: #fff; color: #333; }
  #btn-next { border: none; background: #1a1a2e; color: #52b788; }

  @media (max-width: 400px) {
    .tense-grid.cols3 { grid-template-columns: 1fr; }
    .morph-row.cols3 { grid-template-columns: 1fr 1fr; }
    .lang-row { font-size: 11px; }
  }
</style>
</head>
<body>

<div id="header">
  <div id="app-title">Lingua Matrix</div>
  <div class="pill-group" id="pair-pills"></div>
  <div class="toggle-row">
    <div class="toggle-group">
      <button class="toggle-btn active-mode" id="btn-reference" onclick="setMode('reference')">📖 Reference</button>
      <button class="toggle-btn" id="btn-flashcard" onclick="setMode('flashcard')">🃏 Flashcards</button>
    </div>
    <div class="toggle-group" id="section-toggle">
      <button class="toggle-btn active-section" id="btn-conjugation" onclick="setSection('conjugation')">🔀 Verb Tenses</button>
      <button class="toggle-btn" id="btn-morphology" onclick="setSection('morphology')">🧩 Morphology</button>
    </div>
  </div>
</div>

<div id="day-strip"></div>
<div id="content"></div>

<script>
// ── DATA ─────────────────────────────────────────────────────────────────────
const LANGUAGES = { IT: "Italiano", FR: "Français", ES: "Español" };

const CONJUGATION_DATA = {
  "IT-FR": { tenses: [
    { name:"Present", IT:{label:"Presente",rows:["io parlo","tu parli","lui/lei parla","noi parliamo","voi parlate","loro parlano"]}, FR:{label:"Présent",rows:["je parle","tu parles","il/elle parle","nous parlons","vous parlez","ils/elles parlent"]}, note:"-are / -er verbs: endings diverge at noi/nous but roots match." },
    { name:"Imperfect", IT:{label:"Imperfetto",rows:["io parlavo","tu parlavi","lui/lei parlava","noi parlavamo","voi parlavate","loro parlavano"]}, FR:{label:"Imparfait",rows:["je parlais","tu parlais","il/elle parlait","nous parlions","vous parliez","ils/elles parlaient"]}, note:"Both use -av- stem extension. Very parallel — easiest tense pair to learn." },
    { name:"Future", IT:{label:"Futuro",rows:["io parlerò","tu parlerai","lui/lei parlerà","noi parleremo","voi parlerete","loro parleranno"]}, FR:{label:"Futur simple",rows:["je parlerai","tu parleras","il/elle parlera","nous parlerons","vous parlerez","ils/elles parleront"]}, note:"Almost identical! Both built on infinitive + endings. IT adds accent marks." },
    { name:"Conditional", IT:{label:"Condizionale",rows:["io parlerei","tu parleresti","lui/lei parlerebbe","noi parleremmo","voi parlereste","loro parlerebbero"]}, FR:{label:"Conditionnel",rows:["je parlerais","tu parlerais","il/elle parlerait","nous parlerions","vous parleriez","ils/elles parleraient"]}, note:"Both = future stem + imperfect endings. Parallel logic." },
    { name:"Subjunctive (Pres.)", IT:{label:"Cong. Presente",rows:["io parli","tu parli","lui/lei parli","noi parliamo","voi parliate","loro parlino"]}, FR:{label:"Subjonctif",rows:["que je parle","que tu parles","qu'il parle","que nous parlions","que vous parliez","qu'ils parlent"]}, note:"IT subj. present = indicative for 1st/2nd person. FR requires 'que'." },
    { name:"Subj. Imperfect", IT:{label:"Cong. Imperfetto",rows:["io parlassi","tu parlassi","lui/lei parlasse","noi parlassimo","voi parlaste","loro parlassero"]}, FR:{label:"Subj. Imparfait (literary)",rows:["que je parlasse","que tu parlasses","qu'il parlât","que nous parlassions","que vous parlassiez","qu'ils parlassent"]}, note:"FR subj. imperfect is literary/extinct in speech — IT uses it actively!" },
  ]},
  "IT-ES": { tenses: [
    { name:"Present", IT:{label:"Presente",rows:["io parlo","tu parli","lui/lei parla","noi parliamo","voi parlate","loro parlano"]}, ES:{label:"Presente",rows:["yo hablo","tú hablas","él/ella habla","nosotros hablamos","vosotros habláis","ellos hablan"]}, note:"IT and ES present are almost identical. IT -o → ES -o, IT -a → ES -a, etc." },
    { name:"Imperfect", IT:{label:"Imperfetto",rows:["io parlavo","tu parlavi","lui/lei parlava","noi parlavamo","voi parlavate","loro parlavano"]}, ES:{label:"Imperfecto",rows:["yo hablaba","tú hablabas","él/ella hablaba","nosotros hablábamos","vosotros hablabais","ellos hablaban"]}, note:"Both use -ab- stem. IT -avo/-avi, ES -aba/-abas. Nearly parallel." },
    { name:"Future", IT:{label:"Futuro",rows:["io parlerò","tu parlerai","lui/lei parlerà","noi parleremo","voi parlerete","loro parleranno"]}, ES:{label:"Futuro",rows:["yo hablaré","tú hablarás","él/ella hablará","nosotros hablaremos","vosotros hablaréis","ellos hablarán"]}, note:"Both built on infinitive stem. Endings nearly identical." },
    { name:"Conditional", IT:{label:"Condizionale",rows:["io parlerei","tu parleresti","lui/lei parlerebbe","noi parleremmo","voi parlereste","loro parlerebbero"]}, ES:{label:"Condicional",rows:["yo hablaría","tú hablarías","él/ella hablaría","nosotros hablaríamos","vosotros hablaríais","ellos hablarían"]}, note:"IT ends in -ei/-esti/-ebbe, ES in -ía/-ías/-ía. Same logic, different vowel." },
    { name:"Subjunctive (Pres.)", IT:{label:"Cong. Presente",rows:["io parli","tu parli","lui/lei parli","noi parliamo","voi parliate","loro parlino"]}, ES:{label:"Subj. Presente",rows:["yo hable","tú hables","él/ella hable","nosotros hablemos","vosotros habléis","ellos hablen"]}, note:"IT uses -i endings where indicative uses -a. ES flips: subj uses -e where indicative uses -a." },
    { name:"Subj. Imperfect", IT:{label:"Cong. Imperfetto",rows:["io parlassi","tu parlassi","lui/lei parlasse","noi parlassimo","voi parlaste","loro parlassero"]}, ES:{label:"Subj. Imperfecto",rows:["yo hablara","tú hablaras","él/ella hablara","nosotros habláramos","vosotros hablarais","ellos hablaran"]}, note:"ES also has -se form (hablase). IT -ss- doubles; ES uses -r-. Both actively used!" },
  ]},

    { name:"Present", ES:{label:"Presente",rows:["yo hablo","tú hablas","él/ella habla","nosotros hablamos","vosotros habláis","ellos hablan"]}, FR:{label:"Présent",rows:["je parle","tu parles","il/elle parle","nous parlons","vous parlez","ils/elles parlent"]}, note:"ES keeps -a vowel in present; FR drops it. Both -amos/-ons at 1st plural." },

    { name:"Future", ES:{label:"Futuro",rows:["yo hablaré","tú hablarás","él/ella hablará","nosotros hablaremos","vosotros hablaréis","ellos hablarán"]}, FR:{label:"Futur",rows:["je parlerai","tu parleras","il/elle parlera","nous parlerons","vous parlerez","ils/elles parleront"]}, note:"Both built on infinitive. ES hablar+é, FR parler+ai. Identical logic." },

    { name:"Future", FR:{label:"Futur",rows:["je parlerai","tu parleras","il/elle parlera","nous parlerons","vous parlerez","ils/elles parleront"]}, ES:{label:"Futuro",rows:["yo hablaré","tú hablarás","él/ella hablará","nosotros hablaremos","vosotros hablaréis","ellos hablarán"]}, note:"Mirror image of ES→FR future. Good production drill." },

  "ALL-ALL": [
    { category:"Adverb", IT:"-mente", FR:"-ment", ES:"-mente", examples:[["facilmente","facilement","fácilmente"],["naturalmente","naturellement","naturalmente"],["direttamente","directement","directamente"]] },
    { category:"Noun (-tion)", IT:"-zione", FR:"-tion", ES:"-ción", examples:[["comunicazione","communication","comunicación"],["nazione","nation","nación"],["stazione","station","estación"]] },
    { category:"Verb (-ize)", IT:"-izzare", FR:"-iser", ES:"-izar", examples:[["organizzare","organiser","organizar"],["realizzare","réaliser","realizar"],["modernizzare","moderniser","modernizar"]] },
    { category:"Prefix re-", IT:"ri-", FR:"re-", ES:"re-", examples:[["ricominciare","recommencer","recomenzar"],["ritornare","retourner","retornar"],["rifare","refaire","rehacer"]] },
    { category:"Adj (-ous)", IT:"-oso", FR:"-eux", ES:"-oso", examples:[["famoso","fameux","famoso"],["curioso","curieux","curioso"],["nervoso","nerveux","nervioso"]] },
  ],
};

// ── STATE ────────────────────────────────────────────────────────────────────
const todayJS = new Date().getDay(); // 0=Sun
const defaultPairIdx = [1,0,1,2,3,4,0][todayJS] ?? 0;
let state = {
  pairIdx: defaultPairIdx,
  mode: "reference",
  section: "conjugation",
  cardIdx: 0,
  flipped: false,
};

function getPairKey() {
  const p = PAIRS[state.pairIdx];
  return p.a === "ALL" ? "ALL-ALL" : `${p.a}-${p.b}`;
}

function buildFlashcards(pairKey) {
  const cards = [];
  const conj = CONJUGATION_DATA[pairKey];
  const morph = MORPH_DATA[pairKey];
  if (conj) {
    conj.tenses.forEach(t => {
      const langs = Object.keys(t).filter(k => k !== "name" && k !== "note");
      if (langs.length >= 2) {
        const [la, lb] = langs;
        t[la].rows.forEach((row, i) => {
          cards.push({ type:"conjugation", tense:t.name, front:`${t[la].label}: ${row}`, back:`${t[lb].label}: ${t[lb].rows[i]}`, note:t.note });
        });
      }
    });
  }
  if (morph) {
    morph.forEach(m => {
      const langs = Object.keys(m).filter(k => k !== "category" && k !== "examples");
      m.examples.forEach(ex => {
        cards.push({ type:"morphology", category:m.category, front:`${langs[0]}: ${ex[0]}`, back:`${langs[1]}: ${ex[1]}`, note: langs[2] ? `${langs[2]}: ${ex[2]}` : "" });
      });
    });
  }
  return cards;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderDayStrip() {
  const strip = document.getElementById("day-strip");
  const todayWeekday = new Date().getDay(); // 1=Mon
  strip.innerHTML = DAYS.map((d, i) => {
    const isTodayStrip = (todayWeekday >= 1 && todayWeekday <= 5) && (i === todayWeekday - 1);
    return `<div class="day-cell${isTodayStrip ? " today" : ""}">
      <div class="day-label">${d}</div>
      <div class="day-pair">${DAY_PAIRS[i]}</div>
    </div>`;
  }).join("");
}

function renderPairPills() {
  const container = document.getElementById("pair-pills");
  container.innerHTML = PAIRS.map((p, i) =>
    `<button class="pill${i === state.pairIdx ? " active" : ""}" onclick="selectPair(${i})">${p.label}</button>`
  ).join("");
}

function renderToggles() {
  ["reference","flashcard"].forEach(m => {
    const btn = document.getElementById(`btn-${m}`);
    btn.classList.toggle("active-mode", state.mode === m);
  });
  const sectionToggle = document.getElementById("section-toggle");
  sectionToggle.style.display = state.mode === "reference" ? "flex" : "none";
  ["conjugation","morphology"].forEach(s => {
    const btn = document.getElementById(`btn-${s}`);
    if (btn) btn.classList.toggle("active-section", state.section === s);
  });
}

function renderLangBadges(langs) {
  return langs.map(l =>
    `<div class="lang-badge" style="background:${LANG_COLORS[l]};color:${LANG_ACCENT[l]}">${LANGUAGES[l]}</div>`
  ).join("");
}

function renderConjugation(pairKey) {
  const data = CONJUGATION_DATA[pairKey];
  if (!data) return "<p style='color:#999;padding:20px'>No data for this pair.</p>";
  const tenses = data.tenses;
  const langs = Object.keys(tenses[0]).filter(k => k !== "name" && k !== "note");
  const colClass = langs.length === 3 ? "cols3" : "cols2";

  return `<div class="section-label">Verb: parlare / parler / hablar (to speak)</div>` +
    tenses.map(t => {
      const tlangs = Object.keys(t).filter(k => k !== "name" && k !== "note");
      const tcol = tlangs.length === 3 ? "cols3" : "cols2";
      return `<div class="tense-block">
        <div class="tense-name">${t.name}</div>
        <div class="tense-grid ${tcol}">
          ${tlangs.map(l => `
            <div class="lang-col" style="background:${LANG_COLORS[l]}">
              <div class="lang-col-header" style="background:${LANG_ACCENT[l]}">${t[l].label}</div>
              ${t[l].rows.map((row, i) => `
                <div class="lang-row">
                  <span class="subj-label">${(SUBJECTS[l]||["","","","","",""])[i]||""}</span>
                  <span>${row}</span>
                </div>`).join("")}
            </div>`).join("")}
        </div>
        ${t.note ? `<div class="tense-note">💡 ${t.note}</div>` : ""}
      </div>`;
    }).join("");
}

function renderMorphology(pairKey) {
  const data = MORPH_DATA[pairKey];
  if (!data) return "<p style='color:#999;padding:20px'>No data for this pair.</p>";
  const isAll = pairKey === "ALL-ALL";
  const langKeys = isAll ? ["IT","FR","ES"] : pairKey.split("-");

  return `<div class="section-label">Prefix / Suffix Patterns</div>` +
    data.map(m => {
      const mlangs = Object.keys(m).filter(k => k !== "category" && k !== "examples");
      return `<div class="morph-block">
        <div class="morph-header">
          <span class="morph-cat">${m.category}</span>
          ${mlangs.map(l => `<span class="morph-badge" style="background:${LANG_COLORS[l]};color:${LANG_ACCENT[l]}">${m[l]}</span>`).join("")}
        </div>
        ${m.examples.map(ex => `
          <div class="morph-row ${isAll ? "cols3" : "cols2"}">
            ${ex.map((word, k) => `<span class="morph-word" style="color:${LANG_COLORS[langKeys[k]]||"#333"}">${word}</span>`).join("")}
          </div>`).join("")}
      </div>`;
    }).join("");
}

function renderFlashcard(pairKey) {
  const cards = buildFlashcards(pairKey);
  if (!cards.length) return "<p style='color:#999'>No flashcards for this pair.</p>";
  if (state.cardIdx >= cards.length) state.cardIdx = 0;
  const card = cards[state.cardIdx];
  const flipped = state.flipped;

  return `<div id="flashcard-wrap">
    <div id="card-counter">${state.cardIdx + 1} / ${cards.length} · ${card.type === "conjugation" ? "🔀 Conjugation" : "🧩 Morphology"}</div>
    <div id="card" class="${flipped ? "flipped" : ""}" onclick="flipCard()">
      <div id="card-category">${flipped ? "Answer" : (card.tense || card.category)}</div>
      <div id="card-main">${flipped ? card.back : card.front}</div>
      <div id="card-hint">tap to reveal</div>
      <div id="card-note">${card.note || ""}</div>
    </div>
    <div class="card-btns">
      <button class="card-btn" id="btn-prev" onclick="prevCard()">← Prev</button>
      <button class="card-btn" id="btn-next" onclick="nextCard()">Next →</button>
    </div>
  </div>`;
}

function render() {
  const pairKey = getPairKey();
  const pair = PAIRS[state.pairIdx];
  const langs = pair.a === "ALL" ? ["IT","FR","ES"] : [pair.a, pair.b];

  renderPairPills();
  renderToggles();

  let html = `<div class="lang-badges">${renderLangBadges(langs)}</div>`;

  if (state.mode === "reference") {
    if (state.section === "conjugation") html += renderConjugation(pairKey);
    else html += renderMorphology(pairKey);
  } else {
    html += renderFlashcard(pairKey);
  }

  document.getElementById("content").innerHTML = html;
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function selectPair(idx) {
  state.pairIdx = idx;
  state.cardIdx = 0;
  state.flipped = false;
  render();
}
function setMode(m) {
  state.mode = m;
  state.flipped = false;
  render();
}
function setSection(s) {
  state.section = s;
  render();
}
function flipCard() {
  state.flipped = !state.flipped;
  render();
}
function nextCard() {
  const cards = buildFlashcards(getPairKey());
  state.cardIdx = (state.cardIdx + 1) % cards.length;
  state.flipped = false;
  render();
}
function prevCard() {
  const cards = buildFlashcards(getPairKey());
  state.cardIdx = (state.cardIdx - 1 + cards.length) % cards.length;
  state.flipped = false;
  render();
}

// ── INIT ─────────────────────────────────────────────────────────────────────
renderDayStrip();
render();
</script>
</body>
</html>
