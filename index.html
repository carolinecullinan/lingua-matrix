<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lingua Matrix">
<meta name="theme-color" content="#0d0d1a">
<title>Lingua Matrix</title>
<style>
:root {
  --bg:#0d0d1a; --surf:#16162a; --surf2:#1e1e35; --bord:rgba(255,255,255,0.08);
  --it:#2d6a4f; --ita:#52b788;
  --fr:#1d3557; --fra:#6baed6;
  --es:#7b1d1d; --esa:#f87171;
  --en:#3d2b6b; --ena:#c084fc;
  --gold:#f4c542; --coral:#e07a5f; --mint:#52b788;
  --txt:#f0f0f0; --muted:#777; --r:14px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;}

/* HEADER */
#hdr{background:var(--surf);border-bottom:1px solid var(--bord);padding:10px 14px 8px;flex-shrink:0;}
#title{font-size:10px;letter-spacing:3px;color:var(--mint);text-transform:uppercase;font-weight:800;margin-bottom:8px;}
#ptabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px;}
#ptabs::-webkit-scrollbar{display:none;}
.ptab{flex-shrink:0;padding:5px 14px;border-radius:20px;border:1.5px solid var(--bord);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s;white-space:nowrap;}
.ptab.on{border-color:var(--mint);color:var(--mint);background:rgba(82,183,136,0.1);}
#ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
#dirtog{display:flex;align-items:center;gap:7px;background:var(--surf2);border-radius:20px;padding:5px 12px;cursor:pointer;border:1.5px solid var(--bord);flex-shrink:0;}
#dirtog:active{opacity:.7;}
#dirlbl{font-size:12px;font-weight:800;color:var(--txt);}
#dirico{font-size:14px;color:var(--gold);transition:transform .3s;}
#dirico.flip{transform:scaleX(-1);}
.mpills{display:flex;background:var(--surf2);border-radius:20px;overflow:hidden;border:1.5px solid var(--bord);}
.mpill{padding:5px 13px;border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s;}
.mpill.on{background:var(--coral);color:#fff;border-radius:20px;}

/* SECTION BAR */
#secbar{display:flex;gap:6px;padding:8px 14px;background:var(--surf);border-bottom:1px solid var(--bord);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#secbar::-webkit-scrollbar{display:none;}
.spill{flex-shrink:0;padding:5px 13px;border-radius:20px;border:1.5px solid var(--bord);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .15s;}
.spill.on{border-color:var(--fra);color:var(--fra);background:rgba(107,174,214,0.1);}

/* SCROLL */
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;}
#scroll::-webkit-scrollbar{width:3px;}
#scroll::-webkit-scrollbar-thumb{background:var(--bord);border-radius:3px;}

/* LANG BADGES */
.lbadges{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap;}
.lbadge{border-radius:10px;padding:6px 16px;font-size:13px;font-weight:800;letter-spacing:1px;}
.slbl{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px;}

/* CONJUGATION */
.tblock{margin-bottom:22px;}
.tname{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:8px;font-family:Georgia,serif;}
.tgrid{display:grid;gap:8px;margin-bottom:6px;}
.tgrid.c2{grid-template-columns:1fr 1fr;}
.tgrid.c3{grid-template-columns:1fr 1fr 1fr;}
.lcol{border-radius:var(--rs);overflow:hidden;}
.lhdr{padding:6px 10px;font-size:10px;font-weight:800;letter-spacing:1.5px;color:#fff;text-transform:uppercase;}
.lrow{padding:5px 10px;font-size:12px;color:#e8f4f8;font-family:Georgia,serif;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;gap:5px;}
.lrow:last-child{border-bottom:none;}
.subj{opacity:.4;font-size:10px;min-width:22px;flex-shrink:0;padding-top:1px;}
.tnote{background:rgba(82,183,136,0.08);border-left:3px solid var(--mint);border-radius:0 6px 6px 0;padding:7px 10px;font-size:11px;color:#a8d5b5;font-style:italic;}

/* MORPHOLOGY */
.mblock{margin-bottom:12px;background:var(--surf);border-radius:var(--r);overflow:hidden;border:1px solid var(--bord);}
.mhdr{background:var(--surf2);padding:7px 12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mcat{color:var(--muted);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;}
.mbadge{border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700;font-family:monospace;}
.mrow{display:grid;padding:5px 12px;border-bottom:1px solid var(--bord);}
.mrow:last-child{border-bottom:none;}
.mrow.c2{grid-template-columns:1fr 1fr;}
.mrow.c3{grid-template-columns:1fr 1fr 1fr;}
.mword{font-family:Georgia,serif;font-size:13px;}

/* GRAMMAR CARDS */
.ggroup{margin-bottom:22px;}
.ggttl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:10px;}
.gcard{background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.gcttl{font-size:14px;font-weight:700;color:var(--txt);margin-bottom:6px;font-family:Georgia,serif;}
.gcbody{font-size:12px;color:#bbb;line-height:1.6;margin-bottom:10px;}
.gexs{display:flex;flex-direction:column;gap:6px;}
.gex{background:var(--surf2);border-radius:var(--rs);padding:8px 12px;}
.gexl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:3px;}
.gext{font-family:Georgia,serif;font-size:13px;color:var(--txt);}
.gextr{font-size:11px;color:var(--muted);margin-top:2px;font-style:italic;}
.gnote{margin-top:8px;font-size:11px;color:var(--mint);font-style:italic;}

/* VOCAB REFERENCE */
.vcat{margin-bottom:24px;}
.vcttl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.vtable{background:var(--surf);border-radius:var(--r);overflow:hidden;border:1px solid var(--bord);}
.vrow{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid var(--bord);padding:7px 10px;gap:6px;align-items:start;}
.vrow:last-child{border-bottom:none;}
.vrow.hdr{background:var(--surf2);}
.vhdr{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
.vword{font-family:Georgia,serif;font-size:12px;}
.veng{color:#c084fc;}
.vit{color:var(--ita);}
.vfr{color:var(--fra);}
.ves{color:var(--esa);}

/* FLASHCARDS */
#fcwrap{display:flex;flex-direction:column;gap:10px;}
#fccats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
#fcats::-webkit-scrollbar{display:none;}
.fccat{flex-shrink:0;padding:5px 12px;border-radius:20px;border:1.5px solid var(--bord);background:transparent;color:var(--muted);cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;transition:all .15s;}
.fccat.on{border-color:var(--gold);color:var(--gold);background:rgba(244,197,66,0.1);}
#fcdirmeta{text-align:center;font-size:11px;color:var(--muted);margin-bottom:2px;}
#fcctr{text-align:center;font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:8px;}

#fccard{
  min-height:260px;border-radius:20px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;padding:24px 20px;cursor:pointer;
  background:var(--surf);border:2px solid var(--bord);
  transition:background .2s,border-color .2s,transform .1s;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);user-select:none;margin-bottom:12px;
}
#fccard:active{transform:scale(0.98);}
#fccard.on{background:var(--surf2);border-color:var(--mint);}
#fctag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
#fccard.on #fctag{color:var(--mint);}
#fcfront{width:100%;}
#fcback{display:none;width:100%;}
#fccard.on #fcfront{display:none;}
#fccard.on #fcback{display:block;}
.fc-eng{font-family:Georgia,serif;font-size:22px;color:var(--txt);margin-bottom:4px;}
.fc-ctx{font-size:11px;color:var(--muted);font-style:italic;margin-bottom:6px;}
#fchint{margin-top:14px;font-size:11px;color:rgba(255,255,255,0.18);}
#fccard.on #fchint{display:none;}

.fc-langs{display:flex;flex-direction:column;gap:8px;width:100%;}
.fc-lang-row{border-radius:var(--rs);padding:8px 12px;text-align:left;}
.fc-lang-lbl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:3px;}
.fc-lang-word{font-family:Georgia,serif;font-size:16px;}
.fc-lang-note{font-size:10px;opacity:.6;margin-top:2px;font-style:italic;}

#fcbtns{display:flex;gap:10px;justify-content:center;}
.fcbtn{padding:12px 28px;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all .15s;}
.fcbtn:active{transform:scale(0.96);}
#fcprev{background:var(--surf2);color:var(--muted);border:1.5px solid var(--bord);}
#fcnext{background:var(--mint);color:#0d1a12;}

@media(max-width:380px){
  .tgrid.c3{grid-template-columns:1fr;}
  .vrow{grid-template-columns:1fr 1fr;}.vrow .ves{display:none;}
  .fc-eng{font-size:18px;}
}
</style>
</head>
<body>

  <div id="title">✦ Lingua Matrix</div>
  <div id="ptabs"></div>

      <span id="dirico">⇄</span>

    <div class="mpills">
      <button class="mpill" id="mp-ref" onclick="setMode('ref')">📖 Reference</button>
      <button class="mpill" id="mp-fc" onclick="setMode('fc')">🃏 Cards</button>
    </div>
  </div>
</div>
<div id="secbar"></div>
<div id="scroll"></div>

// ── FLASHCARD BUILDER ────────────────────────────────────────────────────────
function buildVocabCards(){
  const cards=[];
  VOCAB.forEach(cat=>{
    cat.words.forEach(w=>{
      cards.push({cat:cat.cat,en:w.en,it:w.it,fr:w.fr,es:w.es,ctx:w.ctx||""});
    });
  });
  return cards;
}

function getFilteredCards(){
  const all=buildVocabCards();
  if(S.fcat===0) return all;
  const uniqueCats=[...new Set(VOCAB.map(c=>c.cat))];
  const cat=uniqueCats[S.fcat-1];
  return all.filter(c=>c.cat===cat);
}

// ── RENDER HELPERS ───────────────────────────────────────────────────────────
function rConj(){
  const key=pk(),data=CONJ[key]||[],langs=pl();
  return`<div class="slbl">parlare / parler / hablar</div>`+data.map(t=>{
    const tl=Object.keys(t).filter(k=>k!=="name"&&k!=="note");
    const cc=tl.length===3?"c3":"c2";
    return`<div class="tblock"><div class="tname">${t.name}</div><div class="tgrid ${cc}">${tl.map(l=>{const d=t[l];if(!d)return"";const sb=SUBJ[l]||[];return`<div class="lcol" style="background:${COL[l]}"><div class="lhdr" style="background:${ACC[l]}">${d.l}</div>${d.r.map((r,i)=>`<div class="lrow"><span class="subj">${sb[i]||""}</span><span>${r}</span></div>`).join("")}</div>`;}).join("")}</div>${t.note?`<div class="tnote">💡 ${t.note}</div>`:""}</div>`;
  }).join("");
}

function rMorph(){
  const key=pk(),data=MORPH[key]||[],isAll=key==="ALL",langs=isAll?["IT","FR","ES"]:key.split("-"),cc=isAll?"c3":"c2";
  return`<div class="slbl">Suffix & Prefix Patterns</div>`+data.map(m=>{
    const ml=Object.keys(m).filter(k=>k!=="cat"&&k!=="ex");
    return`<div class="mblock"><div class="mhdr"><span class="mcat">${m.cat}</span>${ml.map(l=>`<span class="mbadge" style="background:${COL[l]};color:${ACC[l]}">${m[l]}</span>`).join("")}</div>${m.ex.map(ex=>`<div class="mrow ${cc}">${ex.map((w,k)=>`<span class="mword" style="color:${ACC[langs[k]]||"#ccc"}">${w}</span>`).join("")}</div>`).join("")}</div>`;
  }).join("");
}

function rGrammar(){
  return`<div class="slbl">Grammar Concepts & Cross-Language Patterns</div>`+GRAMMAR.map(g=>`<div class="ggroup"><div class="ggttl">${g.group}</div>${g.cards.map(c=>`<div class="gcard"><div class="gcttl">${c.title}</div><div class="gcbody">${c.body}</div><div class="gexs">${c.examples.map(e=>`<div class="gex"><div class="gexl" style="color:${ACC[e.lang]||"#aaa"}">${LANG[e.lang]||e.lang}</div><div class="gext">${e.text}</div><div class="gextr">${e.trans}</div></div>`).join("")}</div>${c.note?`<div class="gnote">✦ ${c.note}</div>`:""}</div>`).join("")}</div>`).join("");
}

  const uniqueCats=[...new Set(VOCAB.map(c=>c.cat))];

  }).join("");
}

function rRef(){
  const langs=pl();
  const badges=langs.map(l=>`<div class="lbadge" style="background:${COL[l]};color:${ACC[l]}">${LANG[l]}</div>`).join("");
  const body=S.sec==="conj"?rConj():S.sec==="morph"?rMorph():S.sec==="grammar"?rGrammar():rVocabRef();
  return`<div class="lbadges">${badges}${langs.length<3?`<span style="font-size:16px;color:var(--gold);cursor:pointer;align-self:center" onclick="flipDir()">⇄</span>`:""}</div>${body}`;
}

  const uniqueCats=[...new Set(VOCAB.map(c=>c.cat))];
  const catPills=["✦ All",...uniqueCats];
  const pills=catPills.map((c,i)=>`<button class="fccat${i===S.fcat?" on":""}" onclick="setFCat(${i})">${c}</button>`).join("");

  if(!cards.length||S.fci>=cards.length)S.fci=0;
  const card=cards[S.fci];
  const isLangToEn=S.fcdir==="lang-to-en";
  const showLangs=PAIRS[S.pair].id==="ALL"?["IT","FR","ES"]:pl();
  const langRows=showLangs.map(l=>`<div class="fc-lang-row" style="background:${COL[l]}22;border:1px solid ${COL[l]}55;margin-bottom:8px;border-radius:10px;padding:10px 14px;text-align:left"><div class="fc-lang-lbl" style="color:${ACC[l]};font-size:9px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;margin-bottom:4px">${LANG[l]}</div><div style="font-family:Georgia,serif;font-size:17px;color:${ACC[l]}">${card[l.toLowerCase()]}</div></div>`).join("");

  const dirLabel=isLangToEn?"Languages → EN":"EN → Languages";

  return`<div id="fcwrap">
    <div id="fcats" style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;">${pills}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:11px;color:var(--muted)">${S.fci+1} / ${cards.length}</span>
      <button onclick="toggleFCDir()" style="background:var(--surf2);border:1.5px solid var(--bord);color:var(--gold);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;">${dirLabel} ⇄</button>
    </div>
    <div style="background:var(--surf);border:2px solid ${S.fcr?"var(--mint)":"var(--bord)"};border-radius:20px;padding:24px 18px;cursor:pointer;box-shadow:0 8px 32px rgba(0,0,0,0.4);min-height:220px;display:flex;flex-direction:column;justify-content:center;margin-bottom:14px;" onclick="revealCard()">
      ${!S.fcr
        ? isLangToEn
          ? `<div style="width:100%">${langRows}<div style="text-align:center;margin-top:8px;font-size:11px;color:rgba(255,255,255,0.2)">tap to reveal</div></div>`
          : `<div style="text-align:center"><div style="font-family:Georgia,serif;font-size:26px;color:var(--txt);margin-bottom:6px">${card.en}</div>${card.ctx?`<div style="font-size:12px;color:var(--muted);font-style:italic">${card.ctx}</div>`:""}<div style="margin-top:16px;font-size:11px;color:rgba(255,255,255,0.2)">tap to reveal</div></div>`
        : isLangToEn
          ? `<div style="text-align:center"><div style="font-family:Georgia,serif;font-size:26px;color:var(--txt);margin-bottom:6px">${card.en}</div>${card.ctx?`<div style="font-size:12px;color:var(--muted);font-style:italic">${card.ctx}</div>`:""}</div>`
          : `<div style="width:100%">${langRows}</div>`
      }
    </div>
    <div id="fcbtns">
      <button class="fcbtn" id="fcprev" onclick="prevCard()">← Prev</button>
      <button class="fcbtn" id="fcnext" onclick="nextCard()">Next →</button>
    </div>
  </div>`;
}

// ── MAIN RENDER ──────────────────────────────────────────────────────────────
function render(){
  // Pair tabs
  document.getElementById("ptabs").innerHTML=PAIRS.map((p,i)=>{
    const lbl=p.id==="ALL"?"All 3":`${p.a} · ${p.b}`;
    return`<button class="ptab${i===S.pair?" on":""}" onclick="setPair(${i})">${lbl}</button>`;
  }).join("");

  // Dir toggle
  const p=PAIRS[S.pair],[a,b]=pl();
  const dt=document.getElementById("dirtog"),dl=document.getElementById("dirlbl"),di=document.getElementById("dirico");
  if(p.id==="ALL"){dl.textContent="IT · FR · ES";dt.style.opacity="0.3";dt.style.pointerEvents="none";}
  else{dl.textContent=`${a} → ${b}`;dt.style.opacity="1";dt.style.pointerEvents="auto";di.className=S.flip?"flip":"";}

  // Mode pills
  ["ref","fc"].forEach(m=>document.getElementById(`mp-${m}`).classList.toggle("on",S.mode===m));

  // Section bar
  const sb=document.getElementById("secbar");
  if(S.mode==="ref"){
    sb.style.display="flex";
    sb.innerHTML=[
      {id:"vocab",lbl:"📚 Vocab"},
      {id:"conj",lbl:"🔀 Conjugation"},
      {id:"morph",lbl:"🧩 Morphology"},
      {id:"grammar",lbl:"✦ Grammar"},
    ].map(s=>`<button class="spill${S.sec===s.id?" on":""}" onclick="setSec('${s.id}')">${s.lbl}</button>`).join("");
  }else{sb.style.display="none";}

  const sc=document.getElementById("scroll");
  sc.innerHTML=S.mode==="ref"?rRef():rFlash();
  sc.scrollTop=0;
}

// ── ACTIONS ──────────────────────────────────────────────────────────────────
function setPair(i){S.pair=i;S.flip=false;S.fci=0;S.fcr=false;render();}
function flipDir(){if(PAIRS[S.pair].id!=="ALL"){S.flip=!S.flip;S.fci=0;S.fcr=false;render();}}
function setMode(m){S.mode=m;S.fcr=false;render();}
function setSec(s){S.sec=s;render();}
function setFCat(i){S.fcat=i;S.fci=0;S.fcr=false;render();}
function toggleFCDir(){S.fcdir=S.fcdir==="en-to-lang"?"lang-to-en":"en-to-lang";S.fci=0;S.fcr=false;render();}
function revealCard(){if(!S.fcr){S.fcr=true;render();}}
function nextCard(){const c=getFilteredCards();S.fci=(S.fci+1)%c.length;S.fcr=false;render();}
function prevCard(){const c=getFilteredCards();S.fci=(S.fci-1+c.length)%c.length;S.fcr=false;render();}

render();
</script>
</body>
</html>
